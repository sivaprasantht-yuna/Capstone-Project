name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─── 1. Java Spring Boot Backend ───────────────────────────────────────────
  backend-ci:
    name: Backend (Spring Boot 3.3 / Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test Backend
        working-directory: backend
        run: |
          mvn -B clean test-compile

  # ─── 2. Python AI Matching Service ─────────────────────────────────────────
  matching-service-ci:
    name: AI Matching Service (Python 3.11 / FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: matching-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Pytest Suite
        working-directory: matching-service
        run: |
          pytest tests/

  # ─── 3. React Frontend ─────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend (React 18 / TypeScript / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Compilation & Production Build
        working-directory: frontend
        run: npm run build
